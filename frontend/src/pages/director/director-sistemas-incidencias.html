<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Incidencias - Director</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./director-sistemas-dashboard.html">Dashboard</a></li>
        <li><a href="./director-sistemas-incidencias.html" style="background-color: #77aca2; color: #031926;">Incidencias</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="mb-4">
        <h2 class="h3 mb-0" style="color: #031926;">Control General de Incidencias</h2>
        <p class="text-muted small mb-0">Supervisión técnica, asignación y cancelación</p>
      </div>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">

              <tr>
                <th class="ps-3"># ID</th>
                <th>Artículo</th>
                <th>Descripción</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th class="text-center">Asignación</th>
                <th class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-director-incidencias">
              <!-- Se puebla desde director-sistemas-incidencias.js -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
