<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Incidencias - Empleado Municipal</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./empleado-municipal-incidencias.html" style="background-color: #77aca2; color: #031926;">Mis Incidencias</a></li>
        <li><a href="./empleado-municipal-articulos.html">Artículos</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 mb-0" style="color: #031926;">Mis Incidencias</h2>
          <p class="text-muted small mb-0">Seguimiento de problemas técnicos reportados</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaIncidencia">
          + Nueva Incidencia
        </button>
      </div>

      <!-- TABLA CEBRADA DE INCIDENCIAS -->
      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"># ID</th>
                <th>Artículo</th>
                <th>Descripción</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-mis-incidencias">
              <!-- Se puebla dinámicamente desde empleado-municipal-incidencias.js -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- MODAL NUEVA INCIDENCIA -->
      <div class="modal fade" id="modalNuevaIncidencia" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Registrar Nueva Incidencia</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-nueva-incidencia">
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Artículo afectado</label>
                  <select id="select-articulo" class="form-select" required>
                    <option value="" disabled selected>Seleccione un artículo...</option>
                    <option value="Impresora HP LaserJet">Impresora HP LaserJet</option>
                    <option value="Monitor Dell 24">Monitor Dell 24</option>
                    <option value="Switch Cisco 24 Bocas">Switch Cisco 24 Bocas</option>
                    <option value="Sistema de Expedientes">Sistema de Expedientes</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Prioridad</label>
                  <select id="select-prioridad" class="form-select" required>
                    <option value="Baja">Baja</option>
                    <option value="Media" selected>Media</option>
                    <option value="Alta">Alta</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Descripción de la falla</label>
                  <textarea id="input-descripcion" class="form-control" rows="3" placeholder="Detalle el problema presentado..." required></textarea>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Crear Incidencia</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./empleado-municipal-incidencias.js"></script>
</body>
</html>
