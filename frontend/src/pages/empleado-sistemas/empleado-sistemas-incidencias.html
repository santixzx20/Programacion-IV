<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incidencias - Empleado de Sistemas</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./empleado-sistemas-incidencias.html" style="background-color: #77aca2; color: #031926;">Incidencias</a></li>
        <li><a href="./empleado-sistemas-categorias.html">Categorías</a></li>
        <li><a href="./empleado-sistemas-articulos.html">Artículos</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="h3 mb-0" style="color: #031926;">Incidencias Asignadas a Sistemas</h2>
          <p class="text-muted small mb-0">Atención y resolución técnica de fallas asignadas</p>
        </div>
      </div>

      <!-- FILTRO DE ESTADO -->
      <div class="card shadow-sm border-0 mb-3 p-3 bg-light">
        <div class="row g-2 align-items-center">
          <div class="col-md-4">
            <label class="form-label small fw-bold mb-1">Filtrar por estado:</label>
            <select id="filtro-estado" class="form-select form-select-sm">
              <option value="todos">Todos los estados</option>
              <option value="Proceso">En Proceso</option>
              <option value="Finalizada">Finalizada</option>
            </select>
          </div>
        </div>
      </div>

      <!-- TABLA CEBRADA -->
      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"># ID</th>
                <th>Artículo</th>
                <th>Descripción</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th class="text-end pe-3">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-sistemas"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./empleado-sistemas-incidencias.js"></script>
</body>
</html>
