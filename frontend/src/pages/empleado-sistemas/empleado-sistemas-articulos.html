<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículos - Empleado de Sistemas</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./empleado-sistemas-incidencias.html">Incidencias</a></li>
        <li><a href="./empleado-sistemas-categorias.html">Categorías</a></li>
        <li><a href="./empleado-sistemas-articulos.html" style="background-color: #77aca2; color: #031926;">Artículos</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 mb-0" style="color: #031926;">Gestión de Artículos</h2>
          <p class="text-muted small mb-0">Inventario y equipos asignables</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalArt">
          + Nuevo Artículo
        </button>
      </div>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"># ID</th>
                <th>Descripción</th>
                <th>Categoría</th>
                <th class="text-end pe-3">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-articulos"></tbody>
          </table>
        </div>
      </div>

      <!-- MODAL NUEVO ARTÍCULO -->
      <div class="modal fade" id="modalArt" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Agregar Artículo</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-art">
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <input type="text" id="art-nombre" class="form-control" placeholder="Ej: Monitor LED 24" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Categoría</label>
                  <select id="art-cat" class="form-select" required>
                    <option value="" disabled selected>Seleccione una categoría...</option>
                    <option value="Hardware e Insumos">Hardware e Insumos</option>
                    <option value="Software y Sistemas">Software y Sistemas</option>
                    <option value="Redes y Comunicaciones">Redes y Comunicaciones</option>
                  </select>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./empleado-sistemas-articulos.js"></script>
</body>
</html>
