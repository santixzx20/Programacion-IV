<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artículos - Empleado de Sistemas</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./empleado-sistemas-incidencias.html">Incidencias</a></li>
        <li><a href="./empleado-sistemas-categorias.html">Categorías</a></li>
        <li><a href="./empleado-sistemas-articulos.html" style="background-color: #77aca2; color: #031926;">Artículos</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 mb-0" style="color: #031926;">Gestión de Artículos</h2>
          <p class="text-muted small mb-0">Inventario y equipos asignables</p>
        </div>
        <button class="btn btn-primary" id="btn-nuevo-art">
          + Nuevo Artículo
        </button>
      </div>

      <!-- Mensajes de éxito o error -->
      <div id="alerta-art"></div>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"># ID</th>
                <th>Descripción</th>
                <th>Área</th>
                <th>Categoría</th>
                <th class="text-end pe-3">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-articulos"></tbody>
          </table>
        </div>
      </div>

      <!-- MODAL AGREGAR / EDITAR ARTÍCULO -->
      <div class="modal fade" id="modalArt" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="titulo-modal-art">Agregar Artículo</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-art">
              <div class="modal-body">
                <!-- Vacío al agregar; con el id del artículo al editar -->
                <input type="hidden" id="art-id" />
                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <input type="text" id="art-nombre" class="form-control" placeholder="Ej: Monitor LED 24" maxlength="255" required />
                </div>
                <div class="mb-3">
                  <label class="form-label">Área</label>
                  <select id="art-area" class="form-select" required>
                    <option value="" disabled selected>Seleccione un área...</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">Categoría</label>
                  <select id="art-cat" class="form-select" required>
                    <option value="" disabled selected>Seleccione una categoría...</option>
                  </select>
                </div>
                <div id="error-form-art" class="text-danger small"></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- MODAL VER ARTÍCULO -->
      <div class="modal fade" id="modalVerArt" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Detalle de Artículo</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <dl class="row mb-0">
                <dt class="col-4">ID</dt>
                <dd class="col-8" id="ver-art-id"></dd>
                <dt class="col-4">Descripción</dt>
                <dd class="col-8" id="ver-art-descripcion"></dd>
                <dt class="col-4">Área</dt>
                <dd class="col-8" id="ver-art-area"></dd>
                <dt class="col-4">Categoría</dt>
                <dd class="col-8" id="ver-art-categoria"></dd>
                <dt class="col-4">Estado</dt>
                <dd class="col-8"><span class="badge bg-success">Activo</span></dd>
              </dl>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./empleado-sistemas-articulos.js"></script>
</body>
</html>
