<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorías - Empleado de Sistemas</title>
</head>
<body>
  <header>
    <img class="logo" src="/../../../assets/logo-muni.png" alt="Logo Muni">
  </header>

  <div class="layout-cuerpo">
    <nav>
      <ul>
        <li><a href="./empleado-sistemas-incidencias.html">Incidencias</a></li>
        <li><a href="./empleado-sistemas-categorias.html" style="background-color: #77aca2; color: #031926;">Categorías</a></li>
        <li><a href="./empleado-sistemas-articulos.html">Artículos</a></li>
        <li><a href="/index.html" class="text-danger fw-bold">← Salir</a></li>
      </ul>
    </nav>

    <main>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="h3 mb-0" style="color: #031926;">Gestión de Categorías</h2>
          <p class="text-muted small mb-0">Clasificación de artículos del municipio</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCat">
          + Nueva Categoría
        </button>
      </div>

      <div class="card shadow-sm border-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3"># ID</th>
                <th>Descripción</th>
                <th class="text-end pe-3">Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-categorias"></tbody>
          </table>
        </div>
      </div>

      <!-- MODAL NUEVA CATEGORÍA -->
      <div class="modal fade" id="modalCat" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Agregar Categoría</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-cat">
              <div class="modal-body">
                <div class="mb-3">
                  <label class="form-label">Descripción</label>
                  <input type="text" id="cat-nombre" class="form-control" placeholder="Ej: Redes e Insumos" required />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./empleado-sistemas-categorias.js"></script>
</body>
</html>
