<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Gestor de Incidencias</title>
</head>
<body>
  <header>
    <img class="logo" src="assets/logo-muni.png" alt="Logo Muni">
  </header>

  <main class="login-main">
    <div class="card login-card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-1" style="color: #468189;">Gestor de Incidencias</h1>
        <p class="text-muted mb-4">
          Sistema de gestión y control de incidencias informáticas del municipio.
        </p>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="login-usuario" class="form-label">Usuario</label>
            <input type="email" id="login-usuario" class="form-control"
                   placeholder="usuario@correo.com" autocomplete="username" required />
          </div>
          <div class="mb-3">
            <label for="login-contrasenia" class="form-label">Contraseña</label>
            <input type="password" id="login-contrasenia" class="form-control"
                   autocomplete="current-password" required />
          </div>
          <div id="login-error" class="text-danger small mb-2"></div>
          <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>

        <hr class="my-4" style="border-color: #77aca2; opacity: 0.5;">

        <p class="small text-muted mb-1">Cuentas de prueba (contraseña <strong>123456</strong>):</p>
        <ul class="small text-muted mb-0 ps-3">
          <li>Municipal: pamalm@correo.com</li>
          <li>Sistemas: carper@correo.com</li>
          <li>Director: estren@correo.com</li>
        </ul>
      </div>
    </div>
  </main>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
